name: Dijital Tamga Haber Botu

on:
  schedule:
    # Her saat başı çalışır (Dakika 0'da)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dijital-tamga-bot
  cancel-in-progress: false

jobs:
  haber-yayini:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt

      - name: Gereksinimleri Yükle
        run: pip install -r bot/requirements.txt

      - name: Git Ayarlarını Yapılandır
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Botu Çalıştır!
        working-directory: bot
        run: python dijital_tamga.py
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}

      # GITHUB_TOKEN ile yapılan push'lar GitHub tarafından güvenlik amacıyla
      # başka workflow'ları (push tetiklemesiyle) otomatik başlatmaz. Bu yüzden
      # Hugo deploy workflow'unu burada açıkça (workflow_dispatch ile) tetikliyoruz.
      - name: Siteyi Yeniden Yayınla
        run: gh workflow run hugo.yaml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
